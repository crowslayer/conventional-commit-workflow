name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar dependencias MCP
        working-directory: mcp_server
        run: pnpm install --frozen-lockfile

      - name: Build MCP server
        working-directory: mcp_server
        run: pnpm run build

      - name: Create skill bundle
        run: |
          rm -rf dist-skill skill-bundle.zip
          mkdir -p dist-skill
          cp skills/v2.0.0/SKILL.md dist-skill/SKILL.md
          cp skills/v2.0.0/system_prompt.md dist-skill/system_prompt.md
          (cd dist-skill && zip -r ../skill-bundle.zip .)

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release